<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quản lý bốc thăm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📋%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--pine:#0f3b2e;--deep:#07261d;--gold:#ecbd4b;--snow:#fdf9f3;--berry-d:#8f0e22}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 16px;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--snow);background:radial-gradient(ellipse at 50% 0,#1a6a4e 0,var(--pine) 40%,var(--deep) 100%)}
main{max-width:440px;margin:0 auto}
h1{font:400 1.9rem/1.3 'Pacifico',cursive;margin:0 0 6px;text-align:center;text-shadow:0 2px 0 var(--berry-d)}
.sub{margin:0 0 18px;text-align:center;color:#d8e6dc;font-size:.92rem}
label{display:block;font-weight:600;margin:14px 0 6px}
input,textarea{width:100%;padding:12px 14px;font:inherit;color:var(--deep);background:var(--snow);border:3px solid var(--gold);border-radius:12px}
textarea{resize:vertical}
ul{list-style:none;margin:0 0 14px;padding:0;transition:filter .25s}
ul.blur{filter:blur(8px);user-select:none}
li{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;margin-bottom:6px;background:rgba(253,249,243,.12);border-radius:10px}
li b{font-weight:600}
li.wait{opacity:.5}
li span{display:flex;gap:14px}
.row{display:flex;gap:10px}
.copy{display:flex;gap:8px}
.copy input{flex:1;min-width:0}
button{flex:1;padding:12px;font:inherit;font-weight:600;color:var(--deep);background:var(--gold);border:0;border-bottom:4px solid #b8892a;border-radius:12px;cursor:pointer}
button:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{color:var(--snow);background:transparent;border:2px solid rgba(253,249,243,.6)}
.copy button{flex:0 0 auto;padding:0 16px}
.btn{width:100%;margin-top:16px;padding:15px;font-size:1.05rem}
a{color:var(--snow)}
.back{display:block;margin-top:20px;text-align:center;font-size:.9rem}
.hint{margin:8px 0 0;font-size:.85rem;color:#b9cfc2}
.err{color:#ffd1d1;font-weight:600}
.demo{margin:0 0 16px;padding:8px 12px;font-size:.82rem;color:var(--deep);background:var(--gold);border-radius:10px}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.qr{width:200px;max-width:100%;margin:14px auto 0;padding:12px;background:#fff;border-radius:12px}.qr svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<main>
  <h1>Quản lý bốc thăm</h1>
  <p class="sub" id="sub">Đang tải…</p>
  <div id="panel" hidden>
    <p class="hint" id="count"></p>
    <p class="hint">Người tặng → người nhận</p>
    <ul id="list" class="blur"></ul>
    <div class="row"><button id="toggle">Hiện kết quả</button><button id="copy">Sao chép</button></div>
    <label for="plink">Link chơi (gửi cho mọi người)</label>
    <div class="copy"><input id="plink" readonly><button class="ghost" id="cpl">Sao chép</button></div>
    <div class="qr" id="qr" role="img" aria-label="Mã QR của phòng"></div>
    <button class="btn ghost" id="reset">Bốc lại từ đầu</button>
  </div>
  <a class="back" href="../tao/">Tạo phòng khác</a>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
const $ = id => document.getElementById(id);
const fatal = msg => { $('sub').textContent = msg; $('panel').hidden = true; };
const qr = (el, text) => { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); el.innerHTML = q.createSvgTag({ cellSize: 6, margin: 0 }); } catch (e) { console.error(e); } };
const flash = (btn, text, ok) => { btn.textContent = ok; setTimeout(() => btn.textContent = text, 1800); };
(async () => {
  /* Dùng chung cấu hình + cách lưu dữ liệu với index.html nên chỉ cần cài Firebase ở một nơi */
  let L, db;
  try {
    const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
    const m = html.match(/\/\*@@START\*\/([\s\S]*?)\/\*@@END\*\//);
    L = new Function(m[1] + '\nreturn { connect, keyOf };')();
  } catch {
    return fatal('Không đọc được cấu hình từ index.html. Hãy mở qua link GitHub Pages (https://…), không mở file trực tiếp.');
  }
  try { db = await L.connect(); }
  catch (e) { console.error(e); return fatal('Không kết nối được Firebase. Kiểm tra databaseURL và kết nối mạng.'); }
  const q = new URLSearchParams(location.search), room = (q.get('r') || '').toLowerCase(), k = q.get('k') || '';
  if (!room) return fatal('Thiếu mã phòng. Hãy mở bằng link quản lý bạn nhận được khi tạo phòng.');
  let cur = null;
  $('plink').value = new URL('../?r=' + room, location.href).href; qr($('qr'), $('plink').value);

  const render = v => {
    cur = v;
    const list = $('list'); list.replaceChildren();
    let n = 0;
    v.names.forEach(name => {
      const to = v.draws[L.keyOf(name)];
      if (to) n++;
      const li = document.createElement('li'), a = document.createElement('b'), b = document.createElement('span');
      a.textContent = name; b.textContent = to ? '→ ' + to : 'chưa bốc';
      if (!to) li.className = 'wait';
      li.append(a, b); list.append(li);
    });
    $('count').textContent = (v.title ? v.title + ': ' : '') + 'đã bốc ' + n + '/' + v.names.length + ' người'
      + (db.demo ? ' (chế độ chạy thử: chỉ thấy kết quả bốc trên máy này)' : '');
  };

  try {
    db.watch(room, v => {
      if (!v) return fatal('Không tìm thấy phòng. Kiểm tra lại link quản lý.');
      if (v.key !== k) return fatal('Link quản lý không đúng.');
      $('sub').textContent = 'Kết quả cập nhật trực tiếp'; $('panel').hidden = false;
      render(v);
    });
  } catch (e) { console.error(e); return fatal('Không kết nối được Firebase.'); }

  $('toggle').onclick = () => {
    const hidden = $('list').classList.toggle('blur');
    $('toggle').textContent = hidden ? 'Hiện kết quả' : 'Ẩn kết quả';
  };
  $('copy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(cur.names.map(n => n + ' → ' + (cur.draws[L.keyOf(n)] || '(chưa bốc)')).join('\n'));
      flash($('copy'), 'Sao chép', 'Đã sao chép');
    } catch { flash($('copy'), 'Sao chép', 'Không sao chép được'); }
  };
  $('cpl').onclick = async () => {
    try { await navigator.clipboard.writeText($('plink').value); flash($('cpl'), 'Sao chép', 'Đã sao chép'); }
    catch { $('plink').select(); }
  };
  $('reset').onclick = async () => {
    if (!confirm('Xóa toàn bộ kết quả đã bốc và cho mọi người bốc lại từ đầu?')) return;
    try { await db.reset(room); if (db.demo) render({ ...cur, draws: {} }); } catch (e) { console.error(e); alert('Không xóa được. Kiểm tra mạng.'); }
  };
})();
</script>
</body>
</html>
